name: IBS CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "feat/**"

permissions:
  contents: read

jobs:
  test:
    name: Node test suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check next-generation front end
        run: npm run check:next
      - name: Build next-generation front end
        run: npm run build:next
      - name: Run test suite
        run: npm test
